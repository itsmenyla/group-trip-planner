<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Group Trip Planner</title>
  <meta name="description" content="Plan a group trip together: an itinerary the planning team edits, a suggestion board everyone adds to, and RSVPs for every activity.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="trip">
      <p class="eyebrow" id="tripDates">Group trip</p>
      <h1 id="tripName">Group Trip Planner</h1>
      <p class="dest" id="tripDest">Loading…</p>
    </div>
    <div class="who" id="whoChip" hidden>
      <div><b id="whoName"></b><span id="whoRole"></span></div>
      <button class="btn small" id="switchPerson" type="button">Switch person</button>
    </div>
  </header>

  <div class="banner" id="banner" role="status" hidden></div>

  <!-- First visit ever: nobody has set the trip up yet -->
  <form class="panel narrow" id="startView" hidden>
    <h2>Start your trip</h2>
    <p class="note">You’ll be on the planning team. Choose a planner passcode and share it only with the other planners.</p>
    <label>Trip name<input id="startTrip" maxlength="80" required placeholder="e.g. Penang 2027"></label>
    <label>Your name<input id="startName" maxlength="40" autocomplete="name" required></label>
    <label>Planner passcode<input id="startPass" type="password" minlength="4" maxlength="64" autocomplete="new-password" required></label>
    <div class="actions"><button class="btn primary" type="submit">Start planning</button></div>
    <p class="error" id="startError" hidden></p>
  </form>

  <!-- This device doesn't know who is using it yet -->
  <form class="panel narrow" id="whoView" hidden>
    <h2>Who are you?</h2>
    <div id="pickList" class="actions"></div>
    <label>Or add your name<input id="whoNew" maxlength="40" autocomplete="name"></label>
    <label>Planner passcode <span style="font-weight:400">(planning team only)</span><input id="whoPass" type="password" maxlength="64" autocomplete="current-password"></label>
    <div class="actions"><button class="btn primary" type="submit">Continue</button></div>
    <p class="error" id="whoError" hidden></p>
  </form>

  <div id="appView" hidden>
    <div style="display:grid;gap:20px">
      <div id="tripFormSlot"></div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button role="tab" data-tab="itinerary" aria-selected="true">Itinerary <span class="count" id="cItin"></span></button>
        <button role="tab" data-tab="suggestions" aria-selected="false">Suggestions <span class="count" id="cSug"></span></button>
        <button role="tab" data-tab="interest" aria-selected="false">Who’s going</button>
        <button role="tab" data-tab="people" aria-selected="false">People <span class="count" id="cPeople"></span></button>
      </nav>
      <p class="note" id="roleNote"></p>
      <div id="formSlot"></div>
      <main id="listSlot"></main>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
